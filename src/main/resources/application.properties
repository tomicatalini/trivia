spring.application.name=trivia

# MYSQL
spring.datasource.url=jdbc:mysql://localhost:3306/trivia?createDataBaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Determina que se debe hacer con la DB al inicial aplicación: borrar y crear, modificar, etc. 
# update: modifica la estructura si se detectan cambios.
# create: borra y crea
# validatE: verifica si la estructura esta correcta pero no modifica.
# none: no hace nada.
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en la consola (opcional)
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

#logging.level.org.springframework=DEBUG