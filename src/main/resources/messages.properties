# --------------------- Mensajes de error ---------------------

# DATABASE MESSAGES ERRORS
DATABASE_CONNECTION_ERROR=Error al conectar con la base de datos.
DATABASE_QUERY_ERROR=Ocurrió un error al procesar la consulta en la base de datos.
DATABASE_TIMEOUT=La solicitud a la base de datos ha expirado.

# VALIDATIONS ERRORS
VALIDATION_REQUIRED=El campo {0} es obligatorio.
VALIDATION_REQUIRED_MULT=Los siguientes campos son obligatorios: {0}.
VALIDATION_MIN_LENGTH=El campo {0} debe tener al menos {1} caracteres.
VALIDATION_MAX_LENGTH=El campo {0} no puede tener más de {1} caracteres.
VALIDATION_INVALID_FORMAT=El formato del campo {0} es inválido.
VALIDATION_INVALID_EMAIL=El correo electrónico ingresado no es válido.
VALIDATION_INVALID_DATE=La fecha o fechas ingresadas no son válidas.
VALIDATION_INVALID_NUMBER=El valor ingresado en {0} debe ser un número válido.

# USER ERRORS
USER_NOT_FOUND=No se encontró un usuario con el ID {0}.
USER_ALREADY_EXISTS=El usuario con email {0} ya está registrado.
USER_INVALID_CREDENTIALS=Credenciales incorrectas. Verifique su email y contraseña.
USER_UNAUTHORIZED=No tiene permisos para realizar esta acción.
USER_ACCOUNT_DISABLED=La cuenta de usuario está deshabilitada.
USER_PASSWORD_MISMATCH=Las contraseñas no coinciden.

# GAMES ERRORS
GAME_NOT_FOUND=No se encontró un juego con el ID {0}.
GAME_SCORE_INVALID=El puntaje ingresado para el juego no es válido.
GAME_START_DATE_INVALID=La fecha de inicio del juego no puede ser posterior a la fecha de finalización.
GAME_ALREADY_FINISHED=El juego con ID {0} ya ha finalizado.
QUIZ_NOT_FOUND=No se encontró un cuestionario con el ID {0}.
QUESTION_NOT_FOUND=No se encontró una pregunta con el ID {0}.
ANSWER_NOT_FOUND=No se encontró una respuesta con el ID {0}.
ANSWER_INVALID=La respuesta seleccionada no es válida.
QUESTION_CATEGORY_NOT_FOUND=No se encontró la categoría de la pregunta.

# AUTH ERRORS
AUTH_INVALID_TOKEN=El token de autenticación es inválido o ha expirado.
AUTH_ACCESS_DENIED=Acceso denegado. No tiene permisos para esta operación.
AUTH_SESSION_EXPIRED=La sesión ha expirado. Inicie sesión nuevamente.

# SERVER ERRORS
SERVER_ERROR=Ocurrió un error inesperado en el servidor.
SERVER_UNAVAILABLE=El servicio no está disponible en este momento. Intente más tarde.
REQUEST_INVALID=La solicitud es inválida.
REQUEST_MISSING_PARAMETER=Falta el parámetro obligatorio {0}.
UNKNOWN_ERROR=Ocurrió un error desconocido. Contacte al administrador.

# OTHER ERRORS
#{0}: Nombre entidad; {1}: nro de ID. 
ENTITY_NOT_FOUND= {0} con ID {1} no existe.
ENTITY_ID_NOT_FOUND= {0} con ID {1} no existe. 
